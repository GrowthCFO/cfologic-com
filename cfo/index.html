document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

w,44px); line-height: 1.1; letter-spacing: -0.015em; margin: 0 0 0 -0.058em; max-width: 26ch\">Good advice. <span class=\"grad-text\">Nobody running the numbers.<\u002Fspan><\u002Fh2>\n    <p style=\"font-size: 15.5px; line-height: 28px; color: color-mix(in srgb, var(--color-text) 78%, transparent); max-width: 62ch; margin: 21px 0 0\">\n      Your CFO is smart. But the retainer buys a monthly meeting — while the close, the dashboard and the forecast underneath still depend on a bookkeeper they don't manage.\n      When the books run late, the advice runs late, and you're paying senior rates for someone to wait on the numbers.\n    <\u002Fp>\n    <p style=\"font-size: 15.5px; line-height: 28px; color: var(--color-text); font-weight: 600; max-width: 62ch; margin: 16px 0 0\">CFOLogic runs the numbers and the advice as one engagement — that's the whole difference.<\u002Fp>\n    \n  <\u002Fsection>\n\n  <hr style=\"height: 2px; border: 0; margin: 0; background: var(--color-divider)\">\n\n  \n\n  <section id=\"work\" data-screen-label=\"The work\" style=\"padding: 70px 0\">\n    <span style=\"display: block; font-size: 13px; line-height: 14px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-accent-700); margin: 0 0 24px\">The work<\u002Fspan>\n    <h2 style=\"font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: clamp(28px,3.2vw,44px); line-height: 1.1; letter-spacing: -0.015em; margin: 0 0 0 -0.058em\">What <span class=\"grad-text\">forward-looking<\u002Fspan> looks like.<\u002Fh2>\n    <p style=\"font-size: 15.5px; line-height: 28px; color: color-mix(in srgb, var(--color-text) 78%, transparent); max-width: 62ch; margin: 21px 0 42px\">Four fractional CFO engagements, four sides of the job: finance strategy, decision support, owner clarity, and forward-looking planning — measured in dollars and cash, not deliverables.<\u002Fp>\n\n    <div>\n      <div sc-camel-on-click=\"{{ c1Toggle }}\" style=\"{{ c1Wrap }}\">\n        <div style=\"display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px\">\n          <span style=\"font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; padding: 6px 12px; border-radius: 99px; white-space: nowrap; background: var(--color-accent-800); color: #fff\">Finance strategy<\u002Fspan>\n          <span style=\"font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent-700)\">Construction &amp; Trades<\u002Fspan>\n          <span style=\"flex: 1\"><\u002Fspan>\n          <span style=\"{{ c1Plus }}\">+<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"m-stack\" style=\"display: grid; grid-template-columns: 1.5fr 1fr; gap: clamp(24px,4vw,56px); align-items: start\">\n          <div>\n            <h3 style=\"font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: clamp(21px,2.2vw,27px); margin: 0; letter-spacing: -0.01em\">A bidding strategy built on real job economics<\u002Fh3>\n            <div style=\"{{ c1Body }}\"><div style=\"overflow: hidden; min-height: 0\"><p style=\"font-size: 15px; line-height: 26px; color: color-mix(in srgb, var(--color-text) 78%, transparent); margin: 14px 0 0\">A builder was bidding on gut feel — some projects quietly funded the losses on others. As fractional CFO we rebuilt job costing, set a margin floor by project type, and turned it into a bidding strategy the owner applies before signing, not after. The bids changed. So did the bank balance.<\u002Fp><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; gap: 36px\">\n            <div><b class=\"grad-text\" style=\"display: block; font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: clamp(28px,3.4vw,40px); line-height: 1; letter-spacing: -0.02em\">+9 pts<\u002Fb><span style=\"font-size: 12.5px; color: color-mix(in srgb, var(--color-text) 60%, transparent); display: block; margin-top: 6px; l font-weight: 700; color: color-mix(in srgb, var(--color-text) 55%, transparent); margin-bottom: 10px\">Tools<\u002Fdiv><div style=\"display: flex; flex-wrap: wrap; gap: 8px\"><span style=\"font-size: 12px; color: color-mix(in srgb, var(--color-text) 78%, transparent); background: var(--color-accent-100); border: 1px solid var(--color-accent-200); border-radius: 99px; padding: 6px 13px; line-height: 1.3\">QuickBooks<\u002Fspan><span style=\"font-size: 12px; color: color-mix(in srgb, var(--color-text) 78%, transparent); background: var(--color-accent-100); border: 1px solid var(--color-accent-200); border-radius: 99px; padding: 6px 13px; line-height: 1.3\">Job Costing<\u002Fspan><span style=\"font-size: 12px; color: color-mix(in srgb, var(--color-text) 78%, transparent); background: var(--color-accent-100); border: 1px solid var(--color-accent-200); border-radius: 99px; padding: 6px 13px; line-height: 1.3\">Fathom<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div sc-camel-on-click=\"{{ c2Toggle }}\" style=\"{{ c2Wrap }}\">\n        <div style=\"display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px\">\n          <span style=\"font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; padding: 6px 12px; border-radius: 99px; white-space: nowrap; background: var(--color-accent-800); color: #fff\">Owner clarity<\u002Fspan>\n          <span style=\"font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent-700)\">Consumer &amp; Retail<\u002Fspan>\n          <span style=\"flex: 1\"><\u002Fspan>\n          <span style=\"{{ c2Plus }}\">+<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"m-stack\" style=\"display: grid; grid-template-columns: 1.5fr 1fr; gap: clamp(24px,4vw,56px); align-items: start\">\n          <div>\n            <h3 style=\"font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: clamp(21px,2.2vw,27px); margin: 0; letter-spacing: -0.01em\">\"We're profitable. So why is cash always tight?\"<\u002Fh3>\n            <div style=\"{{ c2Body }}\"><div style=\"overflow: hidden; min-height: 0\"><p style=\"font-size: 15px; line-height: 26px; color: color-mix(in srgb, var(--color-text) 78%, transparent); margin: 14px 0 0\">Good months on the P&amp;L, white knuckles before every payroll. The profit was real — it was tied up in inventory and receivables the owner couldn't see. We stood up a 13-week cash forecast and a live dashboard, then walked the owner through it weekly until reading the cash position became a five-minute habit, not our meeting agenda.<\u002Fp><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; gap: 36px\">\n            <div><b class=\"grad-text\" style=\"display: block; font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: clamp(28px,3.4vw,40px); line-height: 1; letter-spacing: -0.02em\">$180K<\u002Fb><span style=\"font-size: 12.5px; color: color-mix(in srgb, var(--color-text) 60%, transparent); display: block; margin-top: 6px; line-height: 1.3; max-width: 14ch\">Trapped cash surfaced<\u002Fspan><\u002Fdiv>\n            <div><b class=\"grad-text\" style=\"display: block; font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: clamp(28px,3.4vw,40px); line-height: 1; letter-spacing: -0.02em\">13-wk<\u002Fb><span style=\"font-size: 12.5px; color: color-mix(in srgb, var(--color-text) 60%, transparent); display: block; margin-top: 6px; line-height: 1.3; max-width: 14ch\">Cash visibility, weekly<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"{{ c2Body }}\"><div style=\"overflow: hidden; min-height: 0\"><div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: clamp(20px,2.6vw,36px); margin-top: clamp(24px,3vw,36px); padding-top: clamp(24px,3vw,32px); border-top: 1px solid var(--color-neutral-200)\">\n          <div><div style=\"font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; color: color-mix(in srgb, var(--color-text) 55%, transparent); margin-bottom: 10px\">What we built<\u002Fdiv><p style=\"font-size: 14.5px; line-height: 24px; color: color-mix(in srgb, var(--color-text) 78%, transparent); margin: 0\">A rolling 13-week cash forecast with AR, AP and scenario stress tests, plus a live dashboard of the numbers that actually move cash.<\u002Fp><\u002Fdiv>\n          <div><div style=\"font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; color: color-mix(in srgb, var(--color-text) 55%, transparent); margin-bottom: 10px\">How we delivered<\u002Fdiv><p style=\"font-size: 14.5px; line-height: 24px; color: color-mix(in srgb, var(--color-text) 78%, transparent); margin: 0\">Mapped the cash conversion cycle with the owner in the room — each week’s session taught them which lever moved cash, until the dashboard needed no translator.<\u002Fp><\u002Fdiv>\n          <div><div style=\"font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; color: color-mix(in srgb, var(--color-text) 55%, transparent); margin-bottom: 10px\">Tools<\u002Fdiv><div style=\"display: flex; flex-wrap: wrap; gap: 8px\"><span style=\"font-size: 12px; color: color-mix(in srgb, var(--color-text) 78%, transparent); background: var(--color-accent-100); border: 1px solid var(--color-accent-200); border-radius: 99px; padding: 6px 13px; line-height: 1.3\">Xero<\u002Fspan><span style=\"font-size: 12px; color: color-mix(in srgb, var(--color-text) 78%, transparent); background: var(--color-accent-100); border: 1px solid var(--color-accent-200); border-radius: 99px; padding: 6px 13px; line-height: 1.3\">13-Week Cash<\u002Fspan><span style=\"font-size: 12px; color: color-mix(in srgb, var(--color-text) 78%, transparent); background: var(--color-accent-100); border: 1px solid var(--color-accent-200); border-radius: 99px; padding: 6px 13px; line-height: 1.3\">Power BI<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div sc-camel-on-click=\"{{ c3Toggle }}\" style=\"{{ c3Wrap }}\">\n        <div style=\"display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px\">\n          <span style=\"font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; padding: 6px 12px; border-radius: 99px; white-space: nowrap; background: var(--color-accent-800); color: #fff\">Decision support<\u002Fspan>\n          <span style=\"font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent-700)\">Professional Services<\u002Fspan>\n          <span style=\"flex: 1\"><\u002Fspan>\n          <span style=\"{{ c3Plus }}\">+<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"m-stack\" style=\"display: grid; grid-template-columns: 1.5fr 1fr; gap: clamp(24px,4vw,56px); align-items: start\">\n          <div>\n            <h3 style=\"font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: clamp(21px,2.2vw,27px); margin: 0; letter-spacing: -0.01em\">\"Can we actually afford this hire?\"<\u002Fh3>\n            <div style=\"{{ c3Body }}\"><div style=\"overflow: hidden; min-height: 0\"><p style=\"font-size: 15px; line-height: 26px; color: color-mix(in srgb, var(--color-text) 78%, transparent); margin: 14px 0 0\">A founder was about to add a $120K role on a hunch the budget could take it. Their bookkeeper kept the books clean — but no one was reading them for decisions. We stepped in as fractional CFO, modelled the hire against real cash and margin, and found the timing was six months early. The hire waited. The runway held.<\u002Fp><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; gap: 36px\">\n            <div><b class=\"grad-text\" style=\"display: block; font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: clamp(28px,3.4vw,40px); line-height: 1; letter-spacing: -0.02em\">$120K<\u002Fb><span style=\"font-size: 12.5px; color: color-mix(in srgb, var(--color-text) 60%, transparent); display: block; margin-top: 6px; line-height: 1.3; max-width: 14ch\">Mistimed hire caught<\u002Fspan><\u002Fdiv>\n            <div><b class=\"grad-text\" style=\"display: block; font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: clamp(28px,3.4vw,40px); line-height: 1; letter-spacing: -0.02em\">6 mo<\u002Fb><span style=\"font-size: 12.5px; color: color-mix(in srgb, var(--color-text) 60%, transparent); display: block; margin-top: 6px; line-height: 1.3; max-width: 14ch\">Runway protected<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"{{ c3Body }}\"><div style=\"overflow: hidden; min-height: 0\"><div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: clamp(20px,2.6vw,36px); margin-top: clamp(24px,3vw,36px); padding-top: clamp(24px,3vw,32px); border-top: 1px solid var(--color-neutral-200)\">\n          <div><div style=\"font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; color: color-mix(in srgb, var(--color-text) 55%, transparent); margin-bottom: 10px\">What we advised<\u002Fdiv><p style=\"font-size: 14.5px; line-height: 24px; color: color-mix(in srgb, var(--color-text) 78%, transparent); margin: 0\">A three-statement model tied to real operations, with hiring and headcount scenarios the founder could run before committing to payroll.<\u002Fp><\u002Fdiv>\n          <div><div style=\"font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; color: color-mix(in srgb, var(--color-text) 55%, transparent); margin-bottom: 10px\">How we engaged<\u002Fdiv><p style=\"font-size: 14.5px; line-height: 24px; color: color-mix(in srgb, var(--color-text) 78%, transparent); margin: 0\">Part-time senior CFO alongside their existing bookkeeper — a monthly working session to pressure-test the big decisions against cash, margin and pipeline.<\u002Fp><\u002Fdiv>\n          <div><div style=\"font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; color: color-mix(in srgb, var(--color-text) 55%, transparent); margin-bottom: 10px\">Focus<\u002Fdiv><div style=\"display: flex; flex-wrap: wrap; gap: 8px\"><span style=\"font-size: 12px; color: color-mix(in srgb, var(--color-text) 78%, transparent); background: var(--color-accent-100); border: 1px solid var(--color-accent-200); border-radius: 99px; padding: 6px 13px; line-height: 1.3\">Financial Model<\u002Fspan><span style=\"font-size: 12px; color: color-mix(in srgb, var(--color-text) 78%, transparent); background: var(--color-accent-100); border: 1px solid var(--color-accent-200); border-radius: 99px; padding: 6px 13px; line-height: 1.3\">Scenario Planning<\u002Fspan><span style=\"font-size: 12px; color: color-mix(in srgb, var(--color-text) 78%, transparent); background: var(--color-accent-100); border: 1px solid var(--color-accent-200); border-radius: 99px; padding: 6px 13px; line-height: 1.3\">Decision Support<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div sc-camel-on-click=\"{{ c4Toggle }}\" style=\"{{ c4Wrap }}\">\n        <div style=\"display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px\">\n          <span style=\"font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; padding: 6px 12px; border-radius: 99px; white-space: nowrap; background: var(--color-accent-800); color: #fff\">Forward-looking planning<\u002Fspan>\n          <span style=\"font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent-700)\">Wholesale &amp; Distribution<\u002Fspan>\n          <span style=\"flex: 1\"><\u002Fspan>\n          <span style=\"{{ c4Plus }}\">+<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"m-stack\" style=\"display: grid; grid-template-columns: 1.5fr 1fr; gap: clamp(24px,4vw,56px); align-items: start\">\n          <div>\n            <h3 style=\"font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: clamp(21px,2.2vw,27px); margin: 0; letter-spacing: -0.01em\">Underpricing and not knowing it<\u002Fh3>\n            <div style=\"{{ c4Body }}\"><div style=\"overflow: hidden; min-height: 0\"><p style=\"font-size: 15px; line-height: 26px; color: color-mix(in srgb, var(--color-text) 78%, transparent); margin: 14px 0 0\">The business had held the same prices for three years, sure their margins were \"fine.\" They weren't. As their fractional CFO, we broke down profit by product and by customer — and found a whole tier that cost more to serve than it brought in. A round of repricing later, the same revenue carried a lot more profit.<\u002Fp><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; gap: 36px\">\n            <div><b class=\"grad-text\" style=\"display: block; font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: clamp(28px,3.4vw,40px); line-height: 1; letter-spacing: -0.02em\">+14%<\u002Fb><span style=\"font-size: 12.5px; color: color-mix(in srgb, var(--color-text) 60%, transparent); display: block; margin-top: 6px; line-height: 1.3; max-width: 14ch\">Blended margin lift<\u002Fspan><\u002Fdiv>\n            <div><b class=\"grad-text\" style=\"display: block; font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: clamp(28px,3.4vw,40px); line-height: 1; letter-spacing: -0.02em\">1 tier<\u002Fb><span style=\"font-size: 12.5px; color: color-mix(in srgb, var(--color-text) 60%, transparent); display: block; margin-top: 6px; line-height: 1.3; max-width: 14ch\">Loss-making, repriced<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"{{ c4Body }}\"><div style=\"overflow: hidden; min-height: 0\"><div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: clamp(20px,2.6vw,36px); margin-top: clamp(24px,3vw,36px); padding-top: clamp(24px,3vw,32px); border-top: 1px solid var(--color-neutral-200)\">\n          <div><div style=\"font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; color: color-mix(in srgb, var(--color-text) 55%, transparent); margin-bottom: 10px\">What we advised<\u002Fdiv><p style=\"font-size: 14.5px; line-height: 24px; color: color-mix(in srgb, var(--color-text) 78%, transparent); margin: 0\">Contribution-margin analysis by product and customer, plus a cost-to-serve model that showed which accounts were quietly losing money.<\u002Fp><\u002Fdiv>\n          <div><div style=\"font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; color: color-mix(in srgb, var(--color-text) 55%, transparent); margin-bottom: 10px\">How we engaged<\u002Fdiv><p style=\"font-size: 14.5px; line-height: 24px; color: color-mix(in srgb, var(--color-text) 78%, transparent); margin: 0\">Part-time senior CFO on a monthly retainer — rebuilt the margin picture from the transaction level up, then ran the repricing calls with the owner, account by account.<\u002Fp><\u002Fdiv>\n          <div><div style=\"font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; color: color-mix(in srgb, var(--color-text) 55%, transparent); margin-bottom: 10px\">Focus<\u002Fdiv><div style=\"display: flex; flex-wrap: wrap; gap: 8px\"><span style=\"font-size: 12px; color: color-mix(in srgb, var(--color-text) 78%, transparent); background: var(--color-accent-100); border: 1px solid var(--color-accent-200); border-radius: 99px; padding: 6px 13px; line-height: 1.3\">Profitability Analysis<\u002Fspan><span style=\"font-size: 12px; color: color-mix(in srgb, var(--color-text) 78%, transparent); background: var(--color-accent-100); border: 1px solid var(--color-accent-200); border-radius: 99px; padding: 6px 13px; line-height: 1.3\">Cost-to-Serve<\u002Fspan><span style=\"font-size: 12px; color: color-mix(in srgb, var(--color-text) 78%, transparent); background: var(--color-accent-100); border: 1px solid var(--color-accent-200); border-radius: 99px; padding: 6px 13px; line-height: 1.3\">Pricing Strategy<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <p style=\"font-size: 12px; margin: 28px 0 0; letter-spacing: 0.02em; color: color-mix(in srgb, var(--color-text) 50%, transparent)\">Representative engagements. Swap for your approved client names and figures before launch.<\u002Fp>\n\n    <h3 style=\"font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: clamp(19px,1.8vw,24px); letter-spacing: -0.01em; margin: clamp(44px,5vw,64px) 0 24px; padding-top: clamp(32px,4vw,44px); border-top: 1px solid var(--color-neutral-200)\">What clients say<\u002Fh3>\n    <div class=\"marquee-wrap\" style=\"overflow: hidden; -webkit-mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent); mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent)\">\n      <div class=\"marquee-track marquee-slow\" style=\"display: flex; gap: 16px; width: max-content; padding: 4px 0; align-items: stretch\">\n\n      <div class=\"glass\" style=\"width: min(380px, 82vw); flex: none; padding: 24px; box-sizing: border-box\">\n        <p style=\"font-size: 14.5px; line-height: 24px; color: color-mix(in srgb, var(--color-text) 78%, transparent); margin: 0 0 18px\">\"CFOLogic has been an outstanding partner for our firm. We've relied on them for outsourced financial operations, including bookkeeping, FP&amp;A, and fractional CFO support, and they've consistently delivered at a high level. Their team is responsive, flexible, and highly professional, and they integrate seamlessly with our workflows.\"<\u002Fp>\n        <div style=\"display: flex; gap: 12px; align-items: center\">\n          <img src=\"237fd7fa-6e98-4378-a59d-18abaff47c12\" alt=\"\" style=\"width: 40px; height: 40px; border-radius: 50%; object-fit: cover\">\n          <div><div style=\"font-size: 14.5px; font-weight: 600; line-height: 1.3\">Chris Sundberg<\u002Fdiv><div style=\"font-size: 12.5px; line-height: 1.3; color: color-mix(in srgb, var(--color-text) 55%, transparent)\">Managing Partner, ForwardFinancial<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"glass\" style=\"width: min(380px, 82vw); flex: none; padding: 24px; box-sizing: border-box\">\n        <p style=\"font-size: 14.5px; line-height: 24px; color: color-mix(in srgb, var(--color-text) 78%, transparent); margin: 0 0 18px\">\"As a founder scaling an enterprise business, having comprehensive support across FinOps, FP&amp;A, and fractional CFO services — all under one roof — has been a game-changer. Their team is proactive, professional, and genuinely invested in our success.\"<\u002Fp>\n        <div style=\"display: flex; gap: 12px; align-items: center\">\n          <img src=\"ebd402d4-89af-4488-a627-28a87525e949\" alt=\"\" style=\"width: 40px; height: 40px; border-radius: 50%; object-fit: cover\">\n          <div><div style=\"font-size: 14.5px; font-weight: 600; line-height: 1.3\">Abhijeet Khadilkar<\u002Fdiv><div style=\"font-size: 12.5px; line-height: 1.3; color: color-mix(in srgb, var(--color-text) 55%, transparent)\">Managing Partner, Spearhead<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"glass\" style=\"width: min(380px, 82vw); flex: none; padding: 24px; box-sizing: border-box\">\n        <p style=\"font-size: 14.5px; line-height: 24px; color: color-mix(in srgb, var(--color-text) 78%, transparent); margin: 0 0 18px\">\"Managing the financial and regulatory complexities of a dual US-India structure 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"3\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg><\u002Fspan>A live dashboard of your real numbers<\u002Fli>\n        <li style=\"display: flex; gap: 11px; align-items: flex-start; font-size: 15px; line-height: 25px\"><span style=\"width: 20px; height: 20px; flex: none; margin-top: 2px; border-radius: 50%; background-image: var(--grad-a); display: grid; place-items: center\"><svg width=\"11\" height=\"11\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"3\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg><\u002Fspan>A rolling 13-week cash forecast<\u002Fli>\n        <li style=\"display: flex; gap: 11px; align-items: flex-start; font-size: 15px; line-height: 25px\"><span style=\"width: 20px; height: 20px; flex: none; margin-top: 2px; border-radius: 50%; background-image: var(--grad-a); display: grid; place-items: center\"><svg width=\"11\" height=\"11\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"3\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg><\u002Fspan>Your first CFO strategy session<\u002Fli>\n      <\u002Ful>\n      <div style=\"background: var(--color-accent-100); border: 1px solid var(--color-accent-200); border-radius: 12px; padding: 20px 24px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap\">\n        <span class=\"grad-text\" style=\"font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: clamp(30px,4vw,44px); line-height: 1; flex: none; letter-spacing: -0.02em\">90<\u002Fspan>\n        <p style=\"margin: 0; font-size: 15px; line-height: 25px; color: color-mix(in srgb, var(--color-text) 82%, transparent); flex: 1; min-width: 240px\">If those four aren't running on cadence by day 90, <b style=\"color: var(--color-accent-900)\">you don't pay another monthly fee until they are.<\u002Fb> Straightforward, and in writing.<\u002Fp>\n      <\u002Fdiv>\n      <p style=\"font-size: 11.5px; line-height: 1.6; color: color-mix(in srgb, var(--color-text) 55%, transparent); margin: 18px 0 0; letter-spacing: 0.02em\">Switching from another firm? The 90-day clock covers the transition — we take over mid-cycle, no gap in your close. Covers the monthly service fee; onboarding is billed separately. Clock starts at onboarding, once we have access to your books and systems. Full terms in your agreement.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <hr style=\"height: 2px; border: 0; margin: 0; background: var(--color-divider)\">\n\n  <section data-screen-label=\"FAQ\" style=\"padding: 70px 0\">\n    <span style=\"display: block; font-size: 13px; line-height: 14px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-accent-700); margin: 0 0 24px\">Questions buyers actually ask<\u002Fspan>\n    <h2 style=\"font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: clamp(28px,3.2vw,44px); line-height: 1.1; letter-spacing: -0.015em; margin: 0 0 42px -0.058em; max-width: 26ch\">Before you book, you probably want to know.<\u002Fh2>\n    <div style=\"max-width: 820px\">\n      <details style=\"border-bottom: 1px solid var(--color-neutral-200)\">\n        <summary style=\"display: flex; justify-content: space-between; gap: 20px; align-items: center; padding: 20px 0; cursor: pointer; font-size: 16.5px; font-weight: 600; list-style: none\">What does switching from my current CFO firm look like?<span style=\"width: 26px; height: 26px; border-radius: 50%; background: var(--color-accent-100); flex: none; display: grid; place-items: center; font-size: 17px; color: var(--color-accent-700)\">+<\u002Fspan><\u002Fsummary>\n        <p style=\"padding: 0 0 20px; font-size: 15px; line-height: 26px; color: color-mix(in srgb, var(--color-text) 78%, transparent); max-width: 70ch; margin: 0\">We run the transition in parallel: your current firm finishes the month they're in while we take access to your books and rebuild the reporting rhythm underneath. There's no gap in your close, and nothing to migrate — we work inside the QuickBooks, Xero or Zoho you already have. Most switches are fully handed over within one cycle.<\u002Fp>\n      <\u002Fdetails>\n      <details style=\"border-bottom: 1px solid var(--color-neutral-200)\">\n        <summary style=\"display: flex; justify-content: space-between; gap: 20px; align-items: center; padding: 20px 0; cursor: pointer; font-size: 16.5px; font-weight: 600; list-style: none\">Who actually does the work?<span style=\"width: 26px; height: 26px; border-radius: 50%; background: var(--color-accent-100); flex: none; display: grid; place-items: center; font-size: 17px; color: var(--color-accent-700)\">+<\u002Fspan><\u002Fsummary>\n        <p style=\"padding: 0 0 20px; font-size: 15px; line-height: 26px; color: color-mix(in srgb, var(--color-text) 78%, transparent); max-width: 70ch; margin: 0\">A named senior partner in the US owns your relationship and every recommendation you receive. Behind them, a dedicated delivery team in India runs your close, dashboards, and forecasts full-time. Nothing reaches your desk without your engagement lead reviewing it. You'll meet the people on your account before you sign.<\u002Fp>\n      <\u002Fdetails>\n      <details style=\"border-bottom: 1px solid var(--color-neutral-200)\">\n        <summary style=\"display: flex; justify-content: space-between; gap: 20px; align-items: center; padding: 20px 0; cursor: pointer; font-size: 16.5px; font-weight: 600; list-style: none\">Who owns my books and data if we part ways?<span style=\"width: 26px; height: 26px; border-radius: 50%; background: var(--color-accent-100); flex: none; display: grid; place-items: center; font-size: 17px; color: var(--color-accent-700)\">+<\u002Fspan><\u002Fsummary>\n        <p style=\"padding: 0 0 20px; font-size: 15px; line-height: 26px; color: color-mix(in srgb, var(--color-text) 78%, transparent); max-width: 70ch; margin: 0\">You do — at all times. We work inside your QuickBooks, Xero, or Zoho, under your accounts. There's no proprietary system to migrate off and no long contract holding you. If you leave, you keep everything, including the models and dashboards we built.<\u002Fp>\n      <\u002Fdetails>\n      <details style=\"border-bottom: 1px solid var(--color-neutral-200)\">\n        <summary style=\"display: flex; justify-content: space-between; gap: 20px; align-items: center; padding: 20px 0; cursor: pointer; font-size: 16.5px; font-weight: 600; list-style: none\">Why not hire an independent fractional CFO?<span style=\"width: 26px; height: 26px; border-radius: 50%; background: var(--color-accent-100); flex: none; display: grid; place-items: center; font-size: 17px; color: var(--color-accent-700)\">+<\u002Fspan><\u002Fsummary>\n        <p style=\"padding: 0 0 20px; font-size: 15px; line-height: 26px; color: color-mix(in srgb, var(--color-text) 78%, transparent); max-width: 70ch; margin: 0\">A good solo CFO is genuinely valuable — until they're on vacation, at capacity, or gone. You'd also still need someone to run the books underneath them. With us, the senior judgment comes with a team behind it: continuity, coverage, and the execution layer included, under one engagement.<\u002Fp>\n      <\u002Fdetails>\n      <details style=\"border-bottom: 1px solid var(--color-neutral-200)\">\n        <summary style=\"display: flex; justify-content: space-between; gap: 20px; align-items: center; padding: 20px 0; cursor: pointer; font-size: 16.5px; font-weight: 600; list-style: none\">Do I have to replace my bookkeeper or CPA?<span style=\"width: 26px; height: 26px; border-radius: 50%; background: var(--color-accent-100); flex: none; display: grid; place-items: center; font-size: 17px; color: var(--color-accent-700)\">+<\u002Fspan><\u002Fsummary>\n        <p style=\"padding: 0 0 20px; font-size: 15px; line-height: 26px; color: color-mix(in srgb, var(--color-text) 78%, transparent); max-width: 70ch; margin: 0\">No. If your bookkeeping works, we come in as your fractional CFO on top of it — two of the four engagements above run exactly that way. If you'd rather hand over the whole function, we run it end to end. Your CPA stays either way; taxes remain their job, and we make their life easier by handing them clean books.<\u002Fp>\n      <\u002Fdetails>\n      <details style=\"border-bottom: 1px solid var(--color-neutral-200)\">\n        <summary style=\"display: flex; justify-content: space-between; gap: 20px; align-items: center; padding: 20px 0; cursor: pointer; font-size: 16.5px; font-weight: 600; list-style: none\">How is this different from what my CPA does?<span style=\"width: 26px; height: 26px; border-radius: 50%; background: var(--color-accent-100); flex: none; display: grid; place-items: center; font-size: 17px; color: var(--color-accent-700)\">+<\u002Fspan><\u002Fsummary>\n        <p style=\"padding: 0 0 20px; font-size: 15px; line-height: 26px; color: color-mix(in srgb, var(--color-text) 78%, transparent); max-width: 70ch; margin: 0\">Your CPA looks backward — taxes, compliance, keeping you out of trouble. We look forward: cash you'll have in thirteen weeks, what a hire does to your runway, which customers actually make you money. Most of our clients keep their CPA and add us; the two roles rarely overlap.<\u002Fp>\n      <\u002Fdetails>\n      <details style=\"border-bottom: 1px solid var(--color-neutral-200)\">\n        <summary style=\"display: flex; justify-content: space-between; gap: 20px; align-items: center; padding: 20px 0; cursor: pointer; font-size: 16.5px; font-weight: 600; list-style: none\">What do I actually get every month?<span style=\"width: 26px; height: 26px; border-radius: 50%; background: var(--color-accent-100); flex: none; display: grid; place-items: center; font-size: 17px; color: var(--color-accent-700)\">+<\u002Fspan><\u002Fsummary>\n        <p style=\"padding: 0 0 20px; font-size: 15px; line-height: 26px; color: color-mix(in srgb, var(--color-text) 78%, transparent); max-width: 70ch; margin: 0\">A clean monthly close, a live dashboard of your real numbers, a rolling 13-week cash forecast updated weekly, and a working strategy session with your CFO. That's the baseline every engagement runs on — the same four things our 90-day guarantee is written against.<\u002Fp>\n      <\u002Fdetails>\n      <details style=\"border-bottom: 1px solid var(--color-neutral-200)\">\n        <summary style=\"display: flex; justify-content: space-between; gap: 20px; align-items: center; padding: 20px 0; cursor: pointer; font-size: 16.5px; font-weight: 600; list-style: none\">Can't I just do this with AI and QuickBooks?<span style=\"width: 26px; height: 26px; border-radius: 50%; background: var(--color-accent-100); flex: none; display: grid; place-items: center; font-size: 17px; color: var(--color-accent-700)\">+<\u002Fspan><\u002Fsummary>\n        <p style=\"padding: 0 0 20px; font-size: 15px; line-height: 26px; color: color-mix(in srgb, var(--color-text) 78%, transparent); max-width: 70ch; margin: 0\">You can get charts that way — and we use those tools ourselves. What AI can't do is stand behind a forecast with your bank, your board, or your biggest customer, or tell you which of forty plausible answers is the right one for your business. You're not paying for the dashboard; you're paying for someone accountable for what it says.<\u002Fp>\n      <\u002Fdetails>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  \n\n<\u002Fdiv>\n\n<section data-screen-label=\"Final CTA\" style=\"background-image: var(--grad-a); color: #fff\">\n  <div style=\"max-width: 1200px; margin: 0 auto; padding: 70px clamp(20px,5vw,72px)\">\n    <span style=\"display: block; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,0.75); margin: 0 0 24px\">Getting started<\u002Fspan>\n    <h2 style=\"font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: clamp(30px,3.6vw,48px); line-height: 1.06; letter-spacing: -0.015em; margin: 0 0 0 -0.058em; max-width: 24ch; color: #fff\">Keep the senior judgment. Lose the layered bill.<\u002Fh2>\n    <p style=\"font-size: 15.5px; line-height: 28px; color: rgba(255,255,255,0.85); max-width: 58ch; margin: 14px 0 0\">\n      Bring your current invoice to a free 30-minute call. A senior CFO will show you, line by line, what the same scope costs with one team running it.\n    <\u002Fp>\n    <div style=\"display: flex; gap: var(--space-3); flex-wrap: wrap; margin-top: 36px\">\n      <a class=\"btn\" href=\"https://cal.com/GrowthCFO\" target=\"_blank\" rel=\"noopener\" style=\"white-space: nowrap; text-decoration: none; background: #fff; color: var(--color-accent-900); border-radius: 10px; padding: 13px 22px; font-size: 15px\" style-hover=\"background: var(--color-accent-100)\">\n        Book a Discovery Call\n        <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M5 12h14M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg>\n      <\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<footer style=\"border-top: 1px solid var(--color-neutral-200); background: color-mix(in srgb, var(--color-accent-100) 40%, #FDFDFD)\">\n  <div class=\"m-stack\" style=\"max-width: 1200px; margin: 0 auto; padding: 48px clamp(20px,5vw,72px) 56px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 28px; font-size: 14px; line-height: 24px\">\n    <div style=\"display: flex; flex-direction: column; gap: 6px\">\n      <a href=\"https://cfologic.com/\" aria-label=\"CFOLogic\" style=\"text-decoration: none\"><img src=\"3f9e99f0-0f89-4960-af4d-d83aae8ab4f6\" alt=\"CFOLogic\" style=\"display: block; height: 40px; width: auto; margin-bottom: 4px\"><\u002Fa>\n      <p style=\"margin: 0; color: color-mix(in srgb, var(--color-text) 70%, transparent)\">The finance team behind ambitious businesses.<\u002Fp>\n    <\u -box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M5 12h14M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg>\n  <\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showLogos&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Sections&quot;}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { ret: 6000, addons: { book: true, fpa: false, tools: false }, openCase: 0 };\n  }\n  renderVals() {\n    const si = (s) => \"https://cdn.simpleicons.org/\" + s;\n    const gf = (d) => \"https://www.google.com/s2/favicons?domain=\" + d + \"&sz=64\";\n    const stackTools = [\n      { name: \"QuickBooks\", cat: \"Ledger\", ico: si(\"quickbooks\") },\n      { name: \"Xero\", cat: \"Ledger\", ico: si(\"xero\") },\n      { name: \"NetSuite\", cat: \"Ledger\", ico: gf(\"netsuite.com\") },\n      { name: \"Rillet\", cat: \"Ledger\", ico: gf(\"rillet.com\") },\n      { name: \"Gusto\", cat: \"Payroll\", ico: si(\"gusto\") },\n      { name: \"Rippling\", cat: \"Payroll\", ico: gf(\"rippling.com\") },\n      { name: \"Ramp\", cat: \"AP\", ico: gf(\"ramp.com\") },\n      { name: \"Bill.com\", cat: \"AP\", ico: gf(\"bill.com\") },\n      { name: \"Slack\", cat: \"Collab\", ico: gf(\"slack.com\") },\n      { name: \"Teams\", cat: \"Collab\", ico: gf(\"teams.microsoft.com\") },\n      { name: \"Microsoft 365\", cat: \"Collab\", ico: gf(\"microsoft365.com\") },\n      { name: \"Google Workspace\", cat: \"Collab\", ico: gf(\"workspace.google.com\") },\n      { name: \"Claude\", cat: \"AI\", ico: si(\"claude\") },\n      { name: \"Azure AI\", cat: \"AI\", ico: gf(\"azure.microsoft.com\") },\n      { name: \"CFOLogic Navigator\", cat: \"AI\", ico: \"/uploads/navigator-logo-azure-round-transparent.png\" },\n      { name: \"HourBeat\", cat: \"AI\", ico: gf(\"hourbeat.app\") }\n    ].map(t => ({ ...t, icoStyle: \"display:block;width:20px;height:20px;background:url('\" + t.ico + \"') center/contain no-repeat\" }));\n    const ADDONS = [\n      { id: \"book\", name: \"Bookkeeping / monthly close\", note: \"outside bookkeeper or CAS firm\", cost: 1000 },\n      { id: \"fpa\", name: \"FP&A / forecasting support\", note: \"model updates, scenarios, board pack\", cost: 1500 },\n      { id: \"tools\", name: \"Dashboards & reporting tools\", note: \"BI seats, templates, licenses\", cost: 300 }\n    ];\n    const fmt = n => \"$\" + Math.round(n).toLocaleString(\"en-US\");\n    const fmtK = n => \"$\" + Math.round(n / 1000) + \"K\";\n    const ret = this.state.ret;\n    const addonMo = ADDONS.reduce((t, a) => t + (this.state.addons[a.id] ? a.cost : 0), 0);\n    const curMo = ret + addonMo;\n    const clampFee = n => Math.min(5000, Math.max(1500, n));\n    const cfoLoMo = clampFee(curMo * 0.4), cfoHiMo = clampFee(curMo * 0.6);\n    const saveLo = (curMo - cfoHiMo) * 12, saveHi = (curMo - cfoLoMo) * 12;\n    const pctLo = Math.max(0, Math.round((1 - cfoHiMo / curMo) * 100));\n    const pctHi = Math.max(0, Math.round((1 - cfoLoMo / curMo) * 100));\n    const rng = (a, b) => a === b ? a : a + \"–\" + b;\n    const addons = ADDONS.map(a => {\n      const on = !!this.state.addons[a.id];\n      return {\n        name: a.name, note: a.note,\n        cost: on ? \"+\" + fmt(a.cost) + \"/mo\" : \"—\",\n        toggle: () => this.setState(st => ({ addons: Object.assign({}, st.addons, { [a.id]: !st.addons[a.id] }) })),\n        rowSt: \"display:flex;align-items:center;gap:13px;width:100%;background:\" + (on ? \"var(--color-accent-100)\" : \"transparent\") + \";border:0;border-left:3px solid \" + (on ? \"var(--color-accent)\" : \"transparent\") + \";border-radius:0 8px 8px 0;padding:11px 14px;cursor:pointer;transition:background 0.16s,border-color 0.16s;font-family:var(--font-body)\",\n        tickSt: \"width:20px;height:20px;flex:none;border-radius:50%;display:grid;place-items:center;transition:all 0.16s;\" + (on ? \"background-image:var(--grad-a);border:1.5px solid transparent\" : \"background:transparent;border:1.5px solid var(--color-neutral-400)\"),\n        tickIcSt: on ? \"opacity:1\" : \"opacity:0\",\n        costSt: \"font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap;transition:color 0.16s;color:\" + (on ? \"var(--color-text)\" : \"color-mix(in srgb, var(--color-text) 50%, transparent)\")\n      };\n    });\n    const caseVals = {};\n    for (let i = 0; i < 4; i++) {\n      const open = this.state.openCase === i;\n      const n = \"c\" + (i + 1);\n      caseVals[n + \"Toggle\"] = () => this.setState({ openCase: open ? -1 : i });\n      caseVals[n + \"Wrap\"] = \"position:sticky;top:108px;z-index:\" + (i + 1) + \";background:rgba(255,255,255,0.97);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);border:1px solid \" + (open ? \"var(--color-accent-300)\" : \"var(--color-neutral-200)\") + \";border-radius:16px;box-shadow:\" + (open ? \"0 16px 44px rgba(0,71,171,0.18)\" : \"0 8px 28px rgba(0,71,171,0.08)\") + \",0 24px 0 0 #fdfdfd\" + \";padding:clamp(24px,3vw,40px);margin-bottom:24px;cursor:pointer;transition:box-shadow 0.25s ease,border-color 0.25s ease\";\n      caseVals[n + \"Body\"] = \"display:grid;grid-template-rows:\" + (open ? \"1fr\" : \"0fr\") + \";transition:grid-template-rows 0.35s ease\";\n      caseVals[n + \"Plus\"] = \"width:26px;height:26px;border-radius:50%;background:var(--color-accent-100);flex:none;display:grid;place-items:center;font-size:17px;color:var(--color-accent-700);transition:transform 0.25s ease;transform:rotate(\" + (open ? \"45deg\" : \"0deg\") + \")\";\n    }\n    return Object.assign(caseVals, {\n      showLogos: this.props.showLogos ?? true,\n      stackTools,\n      addons, ret,\n      retMo: fmt(ret) + \"/mo\",\n      onRet: e => this.setState({ ret: +e.target.value }),\n      oCur: fmt(curMo * 12),\n      oCurMo: fmt(curMo) + \"/mo with add-ons\",\n      oCfo: rng(fmt(cfoLoMo * 12), fmt(cfoHiMo * 12)),\n      oCfoMo: rng(fmt(cfoLoMo), fmt(cfoHiMo)) + \"/mo\",\n      oSave: saveLo > 0 ? rng(fmtK(saveLo), fmtK(saveHi)) : \"—\",\n      oPct: saveLo > 0 ? \"roughly \" + rng(String(pctLo), String(pctHi)) + \"% less, every year\" : \"You're already near our range — talk to us\"\n    });\n  }\n  componentDidMount() {\n    // UTM passthrough: carry ad attribution from the page URL into Cal.com booking links\n    const qs = window.location.search;\n    if (!qs || qs.length < 2) return;\n    document.querySelectorAll('a[href^=\"https://cal.com/GrowthCFO\"]').forEach(a => {\n      const joiner = a.href.indexOf(\"?\") > -1 ? \"&\" : \"?\";\n      a.href = a.href + joiner + qs.substring(1);\n    });\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
